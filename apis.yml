name: Attendease
description: >-
  Attendease (now EventUp Planner, following its acquisition by Tripleseat) is an
  event and meeting management platform for planning, promoting, and running
  virtual, in-person, and hybrid events such as conferences, webinars, roadshows,
  and product launches. Attendease exposes a public developer API in two tiers: an
  Event API scoped to a single event subdomain (attendee tokens, sessions,
  presenters, surveys, sponsors, rooms, venues, and content) and an Organization
  API (`/api/v2/`) that spans business units, events, members, attendees, session
  attendance, check-ins, partners, and contact lists. The Organization API is
  authenticated with HMAC-SHA1 request signing (`Authorization: APIAuth
  access_key:signature`) while the Event API uses attendee/event tokens and HTTP
  Basic auth. First-party JavaScript and Ruby SDKs plus a Jekyll plugin are
  published to npm and RubyGems.
