notes: >-
  First-party SDKs published under the github.com/attendease organization.
  Versions and publish dates below were read from the registry metadata endpoints
  on 2026-08-13. CURRENCY IS THE FINDING: every published first-party client is
  stale relative to the API it wraps. The JavaScript SDK last shipped in January
  2017, the CMS Blocks package in March 2017, and the RubyGems "attendease" gem is
  a 0.0.0 placeholder from 2014 that was never developed. Only the Jekyll plugin
  has a release this decade (2023). The one actively maintained repository,
  attendease-sdk-ruby (pushed 2025-01-29), has never been published to RubyGems —
  its gemspec name "attendease_sdk" returns 404 there — so it is installable only
  from source. No PyPI, NuGet, Maven, Go, Packagist, or crates.io first-party
  package exists.
