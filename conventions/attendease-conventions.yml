    page: Current page number.
    records_per_page: Records per page, integer 1-100 (default 50).
  response_envelope:
    field: pagination
    fields:
      total_records: Total count across all pages.
      num_records: Count of records on the current page (<= page_size).
      page_size: Records per page (default 50).
      page_count: Total number of pages.
      page: Current page number.
