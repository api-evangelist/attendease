    https://eventupplanner.com/accessibility/.
- id: soc2
  conforms: false
  evidence: No SOC 2 report or attestation is published on any Attendease or EventUp Planner surface; a help-center search returns no security-attestation article.
- id: iso-27001
  conforms: false
