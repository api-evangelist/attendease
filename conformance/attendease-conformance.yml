  - name: WCAG 2.1 Level AA
    status: compliant
    self_asserted: true
    scope: pre-built event website and registration form templates
  - name: ADA
    status: compliant
    self_asserted: true
  security_certifications: []
  note: >-
    The ONLY compliance program EventUp Planner publishes is accessibility
    (VPAT / WCAG 2.1 AA / ADA), and all three claims are self-asserted with no
    downloadable attestation. There is no published security or privacy
    certification. Recording this precisely matters: an accessibility VPAT is not
    a security attestation, and a buyer doing vendor diligence on this platform
    will find nothing on the security side without going through sales.
