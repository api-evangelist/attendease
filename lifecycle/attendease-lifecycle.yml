  provider: StatusCake
  http_status: 200
  checked: '2026-08-13'
  machine_readable: false
  notes: >-
    A StatusCake public report is served on Attendease's own subdomain
    (PublicID=status.attendease.com) showing per-monitor uptime history, 7-day
    uptime and an announcements panel. The page body is JS-rendered from
    StatusCake's Workfloor endpoints, so there is no static incident feed, RSS,
    or JSON status endpoint to subscribe to. It is a genuine provider-operated
    status surface, not an incident-communication program.
