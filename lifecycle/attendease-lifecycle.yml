data_lifecycle:
  offboarding_policy: true
  url: https://eventupplanner.zendesk.com/hc/en-us/articles/27101251292311-Off-Boarding-Organizations-and-Events-When-an-Account-Expires
  notes: >-
    The help center publishes an off-boarding article covering what happens to
    organizations and events when an account expires, plus guidance on archiving
    events. This is the closest thing to a published data-retirement policy.
credential_lifecycle:
  event_api: >-
    Event API access tokens are self-managed under Event -> Access Tokens. A
    "default" token (a randomly generated 128-bit UUID) is auto-created for every
    event; additional named tokens can be created and any token can be deleted at
    any time, which immediately revokes it.
  organization_api: >-
    Organization API credentials cannot be self-managed. Deleting or regenerating
    them requires contacting support.
  source: https://eventupplanner.zendesk.com/hc/en-us/articles/27101295757207-Event-and-Organization-API-Keys
provider_change:
  note: >-
    Attendease was acquired by Tripleseat and rebranded to EventUp Planner. The
    developer documentation remains hosted at developer.attendease.com under the
    Attendease name, the API hosts remain on attendease.com / attendease.org, and
    the help center has moved to eventupplanner.zendesk.com. Tripleseat operates a
    separate status page (status.tripleseat.com) that does not cover this product.
sdk_decay:
  note: >-
    The first-party npm SDKs have not been republished since 2017 and the
    RubyGems "attendease" gem is a 0.0.0 placeholder from 2014. See
    packages/attendease-packages.yml for dated evidence.
