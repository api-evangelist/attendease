notes: >-
  EventUp Planner (formerly Attendease) publishes a three-tier plan comparison
  table with named tiers and per-tier feature/quota entitlements, but publishes NO
  prices — every tier routes to a sales conversation. The single most important
  fact for an API consumer is on this page: API Access is an ENTERPRISE-ONLY
  entitlement. The developer documentation is fully public, but the Organization
  API (/api/v2/) is only offered to Enterprise customers, and its credentials are
  issued and rotated by support rather than self-serve
  (https://eventupplanner.zendesk.com/hc/en-us/articles/27101295757207).
plan_count: 3
